name: Release

# Builds the swarmkeeper client as .debs for Linux (x86_64 + arm64), attaches
# them and tarballs to a GitHub release, and publishes the debs to the evoggy
# APT repo (evoggy/packages).
#
# No macOS build: the 3D view uses OpenGL ES (GLSL ES 1.00), which macOS
# does not have.
#
# Secrets: PACKAGING_TOKEN, a token with contents:write on evoggy/packages.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: client

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_version.outputs.version }}

      - name: Verify Cargo.toml version matches tag
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml has $CARGO_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          # Built on 22.04 so the binaries need glibc >= 2.35 only
          # (Ubuntu 22.04+, Debian 12, Raspberry Pi OS bookworm).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm

    runs-on: ${{ matrix.os }}
    env:
      NAME: swarmkeeper-${{ matrix.target }}.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          tar czf "$NAME" -C target/${{ matrix.target }}/release swarmkeeper
          shasum -a 256 "$NAME" > "$NAME.sha256"

      - name: Build deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build
          cp target/${{ matrix.target }}/debian/*.deb .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            client/${{ env.NAME }}
            client/${{ env.NAME }}.sha256
            client/*.deb

  publish-apt:
    # Hand the freshly-released debs to the evoggy APT repo, which pulls them
    # from this release, re-signs the pool and redeploys.
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repository publish
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PACKAGING_TOKEN }}
          repository: evoggy/packages
          event-type: publish-deb
          client-payload: |
            {"repo": "${{ github.repository }}", "tag": "${{ needs.create-release.outputs.version }}", "app": "swarmkeeper"}
