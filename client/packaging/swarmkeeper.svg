<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Rounded Tile Background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0d2137" />

  <!-- Outer Network Constellation Lines -->
  <path d="M 128 54 L 198 128 L 128 202 L 58 128 Z" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linejoin="round" />
  <path d="M 128 54 L 128 202 M 58 128 L 198 128" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4" />

  <!-- Leader Beacon Pulse Ring -->
  <circle cx="128" cy="54" r="28" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="8 6" />

  <!-- Top Leader Drone (Amber - Scaled Larger) -->
