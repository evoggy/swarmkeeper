    <circle cx="13" cy="-13" r="4" fill="#f59e0b" />
    <circle cx="-13" cy="13" r="4" fill="#f59e0b" />
    <circle cx="13" cy="13" r="4" fill="#f59e0b" />
  </g>

  <!-- Wingmen Drones (White) -->
  <g transform="translate(58, 128)">
    <path d="M -9 -9 L 9 9 M -9 9 L 9 -9" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="-9" cy="-9" r="2.5" fill="#ffffff" /><circle cx="9" cy="-9" r="2.5" fill="#ffffff" />
    <circle cx="-9" cy="9" r="2.5" fill="#ffffff" /><circle cx="9" cy="9" r="2.5" fill="#ffffff" />
  </g>
  <g transform="translate(198, 128)">
    <path d="M -9 -9 L 9 9 M -9 9 L 9 -9" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="-9" cy="-9" r="2.5" fill="#ffffff" /><circle cx="9" cy="-9" r="2.5" fill="#ffffff" />
    <circle cx="-9" cy="9" r="2.5" fill="#ffffff" /><circle cx="9" cy="9" r="2.5" fill="#ffffff" />
  </g>
  <g transform="translate(128, 128)">
    <path d="M -9 -9 L 9 9 M -9 9 L 9 -9" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="-9" cy="-9" r="2.5" fill="#ffffff" /><circle cx="9" cy="-9" r="2.5" fill="#ffffff" />
    <circle cx="-9" cy="9" r="2.5" fill="#ffffff" /><circle cx="9" cy="9" r="2.5" fill="#ffffff" />
  </g>
  <g transform="translate(128, 202)">
    <path d="M -9 -9 L 9 9 M -9 9 L 9 -9" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="-9" cy="-9" r="2.5" fill="#ffffff" /><circle cx="9" cy="-9" r="2.5" fill="#ffffff" />
    <circle cx="-9" cy="9" r="2.5" fill="#ffffff" /><circle cx="9" cy="9" r="2.5" fill="#ffffff" />
